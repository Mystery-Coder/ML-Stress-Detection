<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyzing - MoodSense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-ring { animation: spin 1.2s linear infinite; }

    @keyframes pulse-soft {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .pulse-soft { animation: pulse-soft 2s ease-in-out infinite; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
    .w-bar { animation: wave 1.4s ease-in-out infinite; transform-origin: bottom; }
    .w-bar:nth-child(1) { animation-delay: 0s; }
    .w-bar:nth-child(2) { animation-delay: 0.15s; }
    .w-bar:nth-child(3) { animation-delay: 0.3s; }
    .w-bar:nth-child(4) { animation-delay: 0.45s; }
    .w-bar:nth-child(5) { animation-delay: 0.6s; }
    .w-bar:nth-child(6) { animation-delay: 0.75s; }
    .w-bar:nth-child(7) { animation-delay: 0.9s; }
    .w-bar:nth-child(8) { animation-delay: 1.05s; }
    .w-bar:nth-child(9) { animation-delay: 1.2s; }
  </style>
</head>
<body class="bg-[#f8fafc] font-sans text-[#475569] antialiased min-h-screen flex items-center justify-center">
  <div class="text-center max-w-sm mx-auto px-8">
    <!-- Analyzing state -->
    <div class="mb-6">
      <div class="w-16 h-16 rounded-full border-2 border-[#EF9F27] flex items-center justify-center mx-auto spinner-ring">
        <div class="w-11 h-11 rounded-full bg-[#EF9F27] flex items-center justify-center">
          <svg class="w-5 h-5 stroke-white fill-none stroke-2" viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-center gap-0.5 h-8 mb-4">
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:30%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:55%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:85%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:45%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:90%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:60%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:35%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:75%"></div>
      <div class="w-1 rounded-sm bg-[#EF9F27] opacity-60 w-bar" style="height:50%"></div>
    </div>

    <h1 class="text-base font-semibold text-[#0f172a] mb-1">Analyzing your voice</h1>
    <p class="text-xs text-[#94a3b8] leading-relaxed pulse-soft">Processing MFCC features through our model. This may take a few moments...</p>
  </div>

  <script>
    function checkStatus() {
      fetch('/check_status')
        .then(response => response.json())
        .then(data => {
          if (data.status === "completed") {
            window.location.href = data.redirect_url;
          } else {
            setTimeout(checkStatus, 3000);
          }
        })
        .catch(error => console.error('Error checking status:', error));
    }

    document.addEventListener("DOMContentLoaded", () => {
      checkStatus();
    });
  </script>
</body>
</html>
